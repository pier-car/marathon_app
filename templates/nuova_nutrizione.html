{% extends "base.html" %}
{% block title %}Nuova Nutrizione{% endblock %}

{% block content %}
<div class="page">
    <div class="page-header">
        <a href="{{ url_for('nutrizione') }}" class="btn-back">← Indietro</a>
        <h2>🍽️ Nutrizione & Integrazione</h2>
    </div>

    <form method="POST" action="{{ url_for('nuova_nutrizione') }}" class="form">
        <div class="form-group">
            <label for="data">Data *</label>
            <input type="date" id="data" name="data" value="{{ oggi }}" required class="input-field">
        </div>

        <h3 class="form-section-title">🍽️ Macronutrienti</h3>
        <div class="form-row">
            <div class="form-group">
                <label for="calorie_assunte">Calorie (kcal)</label>
                <input type="number" id="calorie_assunte" name="calorie_assunte" min="0" max="10000"
                       class="input-field" inputmode="numeric" placeholder="2500">
            </div>
            <div class="form-group">
                <label for="proteine_gr">Proteine (g)</label>
                <input type="number" id="proteine_gr" name="proteine_gr" min="0" max="500"
                       class="input-field" inputmode="numeric" placeholder="150">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="carboidrati_gr">Carboidrati (g)</label>
                <input type="number" id="carboidrati_gr" name="carboidrati_gr" min="0" max="1000"
                       class="input-field" inputmode="numeric" placeholder="300">
            </div>
            <div class="form-group">
                <label for="grassi_gr">Grassi (g)</label>
                <input type="number" id="grassi_gr" name="grassi_gr" min="0" max="500"
                       class="input-field" inputmode="numeric" placeholder="80">
            </div>
        </div>

        <h3 class="form-section-title">💧 Idratazione & Integrazione</h3>
        <div class="form-row">
            <div class="form-group">
                <label for="acqua_litri">Acqua (litri)</label>
                <input type="number" id="acqua_litri" name="acqua_litri" step="0.1" min="0" max="10"
                       class="input-field" inputmode="decimal" placeholder="2.5">
            </div>
            <div class="form-group">
                <label for="peso">Peso Odierno (kg)</label>
                <input type="number" id="peso" name="peso" step="0.1" min="30" max="200"
                       class="input-field" inputmode="decimal" placeholder="75.0">
            </div>
        </div>

        <div class="form-group checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" name="creatina_preso" value="1">
                <span>💊 Creatina Presa</span>
            </label>
        </div>

        <div class="form-group checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" name="proteine_prese" value="1">
                <span>🥤 Proteine Prese</span>
            </label>
        </div>

        <div class="form-group">
            <label for="note">Note</label>
            <textarea id="note" name="note" class="input-field" rows="2"
                      placeholder="Integratori, pasti speciali..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-full">💾 Salva Nutrizione</button>
    </form>
</div>
{% endblock %}
